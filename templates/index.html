<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #67707f;
      --accent: #ff3621;
      --accent-hover: #e52a17;
      --border: #e4e7ec;
      --shadow: 0 8px 24px rgba(23, 30, 49, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 48px 20px;
      line-height: 1.5;
    }

    .container { max-width: 660px; margin: 0 auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 28px;
      margin-bottom: 24px;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .hint { color: var(--muted); font-size: 14px; margin: 0 0 20px; }

    form label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-row { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 54, 33, 0.12);
    }

    input[type="text"]::placeholder { color: #a3abba; }

    button {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }

    #result {
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 14px;
      color: var(--text);
      background: #f8f9fb;
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 8px;
    }

    #result:empty { display: none; }

    table { width: 100%; margin-top: 8px; border-collapse: collapse; }

    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: left;
      padding: 10px 12px;
      border-bottom: 2px solid var(--border);
    }

    td {
      padding: 12px;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
    }

    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbfc; }

    td:nth-child(1) { font-weight: 600; }
    td:nth-child(2) { color: var(--muted); font-size: 14px; }
    td:nth-child(3) { font-variant-numeric: tabular-nums; font-weight: 600; }
    td:nth-child(4) { color: var(--muted); font-size: 14px; }

    @media (max-width: 560px) {
      body { padding: 24px 12px; }
      .card { padding: 20px; }
      .input-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📈 Stock Watchlist</h1>
      <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

      <form id="stock-form">
        <label for="symbol">Ticker symbol</label>
        <div class="input-row">
          <input type="text" id="symbol" name="symbol" placeholder="AAPL" required autocomplete="off">
          <button type="submit">Add to watchlist</button>
        </div>
      </form>

      <div id="result"></div>
    </div>

    <div class="card">
      <h2>Your watchlist</h2>
      <table id="watchlist-table">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Email</th>
            <th>Latest price</th>
            <th>Updated</th>
          </tr>
        </thead>
        <tbody id="watchlist-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
